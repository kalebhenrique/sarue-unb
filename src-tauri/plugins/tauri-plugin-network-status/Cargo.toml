[package]
name = "tauri-plugin-network-status"
version = "0.1.0"
authors = ["UnB Open Source Contributors"]
description = "Local Tauri 2 plugin for querying network connection type and metered status"
edition = "2021"
links = "tauri-plugin-network-status"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
specta = { version = "2.0.0-rc", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
