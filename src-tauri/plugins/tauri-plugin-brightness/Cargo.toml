[package]
name = "tauri-plugin-brightness"
version = "0.1.0"
authors = ["UnB Open Source Contributors"]
description = "Local Tauri 2 plugin for maximum screen brightness and keep-screen-on."
edition = "2021"
license = "Apache-2.0"
links = "tauri-plugin-brightness"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", default-features = false }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
