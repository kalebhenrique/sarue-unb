[package]
name = "sarue_unb"
version = "0.3.1"
description = "Saruê UnB Desktop App"
authors = ["UnB Open Source Contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "sarue_unb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pdf-extract = "0.7"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-stronghold = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "rustls", "form"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
scraper = "0.27"
regex = "1.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["javascript", "typescript"] }
specta = { version = "2.0.0-rc", features = ["derive"] }
specta-typescript = "0.0.12"
rand = "0.8"

[dev-dependencies]
iota_stronghold = "2.1.0"
zeroize = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
keyring = "3"

# Otimiza as primitivas criptográficas do Stronghold (Argon2id + Scrypt/Salsa20/SHA2/ChaCha20) em modo dev/test.
# Sem isso, Stronghold.load / Stronghold.save em opt-level=0 leva ~45-90s de 100% CPU e trava o app.
[profile.dev.package.blake2b_simd]
opt-level = 3

[profile.dev.package.rust-argon2]
opt-level = 3

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.cipher]
opt-level = 3

[profile.dev.package.inout]
opt-level = 3

[profile.dev.package.iota-crypto]
opt-level = 3

[profile.dev.package.stronghold_engine]
opt-level = 3

[profile.dev.package.iota_stronghold]
opt-level = 3

