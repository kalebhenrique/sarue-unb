name: "Preview Build (Android)"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      target:
        description: 'Arquitetura alvo do Android'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - armv7
          - x86_64
          - i686

concurrency:
  group: preview-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  notify-start:
    name: "Comentar início do build na PR"
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    concurrency:
      group: preview-comment-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Post comment "build em andamento"
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const marker = '<!-- sarue-preview-artifacts -->';
            const shortSha = pr.head.sha.slice(0, 7);

            const body = [
              marker,
              `### 📦 Builds de Preview (\`${shortSha}\`)`,
              '',
              '🔄 Build de preview iniciado. Aguarde — este comentário será atualizado com os links dos artefatos quando os builds terminarem.',
              '',
              '| Plataforma | Status | Artefato |',
              '| --- | --- | --- |',
              '| Android (`aarch64` APK) | ⏳ Em andamento | — |',
              '| macOS (`aarch64-apple-darwin` DMG) | ⏳ Em andamento | — |',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }
            core.info(`Comentário de "em andamento" postado no PR #${pr.number}.`);

  build-android-preview:
    name: "Build Android Preview (${{ inputs.target || 'aarch64' }})"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.pull_request.labels.*.name, 'preview') &&
        (github.event.action != 'labeled' || github.event.label.name == 'preview')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (API 36/37.0 & NDK)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Ensure Android debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-directories: |
            src-tauri/gen/android/.tauri
            src-tauri/plugins/tauri-plugin-brightness/android/.tauri
            src-tauri/plugins/tauri-plugin-network-status/android/.tauri
            src-tauri/plugins/tauri-plugin-share/android/.tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android Preview APK
        run: |
          chmod +x src-tauri/gen/android/gradlew
          node scripts/tauri-cli.mjs android build --preview --apk --target ${{ inputs.target || 'aarch64' }}

      - name: Prepare Preview APK artifact
        run: |
          APK_SRC="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          APK_DST="src-tauri/gen/android/app/build/outputs/apk/universal/release/sarue-unb-preview-${{ inputs.target || 'aarch64' }}.apk"
          cp "$APK_SRC" "$APK_DST"
          ls -lh "$APK_DST"

      - name: Upload Android Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: sarue-unb-preview-android-${{ inputs.target || 'aarch64' }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/sarue-unb-preview-*.apk
          if-no-files-found: error
          retention-days: 14

  comment-preview:
    name: "Comentar links dos artefatos na PR"
    needs: build-android-preview
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      group: preview-comment-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Post or update PR comment with preview artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const headSha = pr.head.sha;

            const targets = [
              { label: 'Android (`aarch64` APK)', file: 'preview-android.yml' },
              { label: 'macOS (`aarch64-apple-darwin` DMG)', file: 'preview-macos.yml' },
            ];

            const rows = [];
            for (const target of targets) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: target.file,
                head_sha: headSha,
                event: 'pull_request',
                per_page: 10,
              });

              const sorted = [...data.workflow_runs].sort((a, b) => b.id - a.id);
              const latest = sorted.find((r) => r.conclusion !== 'skipped') || sorted[0];

              if (!latest || latest.conclusion === 'skipped') {
                rows.push(`| ${target.label} | ⏸️ Não executado | — |`);
                continue;
              }

              if (latest.status !== 'completed') {
                rows.push(`| ${target.label} | ⏳ Em andamento | [Ver execução](${latest.html_url}) |`);
                continue;
              }

              if (latest.conclusion !== 'success') {
                rows.push(
                  `| ${target.label} | ❌ Falhou (\`${latest.conclusion}\`) | [Ver logs](${latest.html_url}) |`
                );
                continue;
              }

              const { data: artData } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: latest.id,
              });

              if (artData.artifacts.length === 0) {
                rows.push(`| ${target.label} | ⚠️ Sem artefatos | [Ver execução](${latest.html_url}) |`);
                continue;
              }

              const links = artData.artifacts
                .map(
                  (art) =>
                    `[${art.name}](https://github.com/${owner}/${repo}/actions/runs/${latest.id}/artifacts/${art.id})`
                )
                .join('<br>');

              rows.push(`| ${target.label} | ✅ Pronto | ${links} · [Execução](${latest.html_url}) |`);
            }

            const marker = '<!-- sarue-preview-artifacts -->';
            const shortSha = headSha.slice(0, 7);
            const body = [
              marker,
              `### 📦 Builds de Preview (\`${shortSha}\`)`,
              '',
              '| Plataforma | Status | Artefato |',
              '| --- | --- | --- |',
              ...rows,
              '',
              '> Os artefatos ficam disponíveis por **14 dias** (necessário estar logado no GitHub para baixar).',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Comentário ${existing.id} atualizado no PR #${pr.number}.`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
              core.info(`Novo comentário criado no PR #${pr.number}.`);
            }
