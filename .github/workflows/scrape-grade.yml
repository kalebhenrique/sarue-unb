name: Scrape SIGAA Grade (Turmas e Horários)

on:
  schedule:
    # Executa diariamente às 05:00 UTC (02:00 BRT)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Ano letivo específico (vazio = raspa semestre atual + próximo)'
        required: false
        default: ''
      period:
        description: 'Período letivo específico (1 ou 2; vazio = raspa semestre atual + próximo)'
        required: false
        default: ''

concurrency:
  group: scrape-sigaa-data
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    name: Scrape Turmas e Publicar em gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar scraping de turmas e departamentos
        env:
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_PERIOD: ${{ inputs.period }}
        run: |
          if [ -n "$INPUT_YEAR" ] && [ -n "$INPUT_PERIOD" ]; then
            pnpm run scrape:grade \
              --year "$INPUT_YEAR" \
              --period "$INPUT_PERIOD" \
              --out-dir ./dist-data
          else
            pnpm run scrape:grade \
              --all-semesters \
              --out-dir ./dist-data
          fi

      - name: Executar scraping de calendários acadêmicos (SAA UnB)
        run: |
          pnpm run scrape:calendar --out-dir ./dist-data

      - name: Publicar dados estáticos na branch órfã gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist-data
          destination_dir: data
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore(data): atualizar grade de turmas SIGAA [skip ci]'
