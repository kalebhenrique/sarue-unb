name: "Preview Build (macOS)"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      target:
        description: 'Arquitetura alvo do macOS'
        required: true
        default: 'aarch64-apple-darwin'
        type: choice
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - both

concurrency:
  group: preview-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  notify-start:
    name: "Comentar início do build na PR"
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    concurrency:
      group: preview-comment-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Post comment "build em andamento"
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const marker = '<!-- sarue-preview-artifacts -->';
            const shortSha = pr.head.sha.slice(0, 7);

            const body = [
              marker,
              `### 📦 Builds de Preview (\`${shortSha}\`)`,
              '',
              '🔄 Build de preview iniciado. Aguarde — este comentário será atualizado com os links dos artefatos quando os builds terminarem.',
              '',
              '| Plataforma | Status | Artefato |',
              '| --- | --- | --- |',
              '| Android (`aarch64` APK) | ⏳ Em andamento | — |',
              '| macOS (`aarch64-apple-darwin` DMG) | ⏳ Em andamento | — |',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }
            core.info(`Comentário de "em andamento" postado no PR #${pr.number}.`);

  build-macos-preview:
    name: "Build macOS Preview (${{ matrix.target }})"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.pull_request.labels.*.name, 'preview') &&
        (github.event.action != 'labeled' || github.event.label.name == 'preview')
      )
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event.inputs.target == 'both' && fromJSON('["aarch64-apple-darwin", "x86_64-apple-darwin"]') || fromJSON(format('["{0}"]', github.event.inputs.target || 'aarch64-apple-darwin')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS Preview DMG
        run: pnpm macos:preview --target ${{ matrix.target }}

      - name: Verify macOS bundle code signature
        run: |
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Saruê UnB (Preview).app"
          codesign -dv --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute -vv "$APP_PATH" || true

      - name: Upload macOS Preview DMG
        uses: actions/upload-artifact@v4
        with:
          name: sarue-unb-preview-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  comment-preview:
    name: "Comentar links dos artefatos na PR"
    needs: build-macos-preview
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      group: preview-comment-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Post or update PR comment with preview artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const headSha = pr.head.sha;

            const targets = [
              { label: 'Android (`aarch64` APK)', file: 'preview-android.yml' },
              { label: 'macOS (`aarch64-apple-darwin` DMG)', file: 'preview-macos.yml' },
            ];

            const rows = [];
            for (const target of targets) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: target.file,
                head_sha: headSha,
                event: 'pull_request',
                per_page: 10,
              });

              const sorted = [...data.workflow_runs].sort((a, b) => b.id - a.id);
              const latest = sorted.find((r) => r.conclusion !== 'skipped') || sorted[0];

              if (!latest || latest.conclusion === 'skipped') {
                rows.push(`| ${target.label} | ⏸️ Não executado | — |`);
                continue;
              }

              if (latest.status !== 'completed') {
                rows.push(`| ${target.label} | ⏳ Em andamento | [Ver execução](${latest.html_url}) |`);
                continue;
              }

              if (latest.conclusion !== 'success') {
                rows.push(
                  `| ${target.label} | ❌ Falhou (\`${latest.conclusion}\`) | [Ver logs](${latest.html_url}) |`
                );
                continue;
              }

              const { data: artData } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: latest.id,
              });

              if (artData.artifacts.length === 0) {
                rows.push(`| ${target.label} | ⚠️ Sem artefatos | [Ver execução](${latest.html_url}) |`);
                continue;
              }

              const links = artData.artifacts
                .map(
                  (art) =>
                    `[${art.name}](https://github.com/${owner}/${repo}/actions/runs/${latest.id}/artifacts/${art.id})`
                )
                .join('<br>');

              rows.push(`| ${target.label} | ✅ Pronto | ${links} · [Execução](${latest.html_url}) |`);
            }

            const marker = '<!-- sarue-preview-artifacts -->';
            const shortSha = headSha.slice(0, 7);
            const body = [
              marker,
              `### 📦 Builds de Preview (\`${shortSha}\`)`,
              '',
              '| Plataforma | Status | Artefato |',
              '| --- | --- | --- |',
              ...rows,
              '',
              '> Os artefatos ficam disponíveis por **14 dias** (necessário estar logado no GitHub para baixar).',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Comentário ${existing.id} atualizado no PR #${pr.number}.`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
              core.info(`Novo comentário criado no PR #${pr.number}.`);
            }
