name: "Comment Preview Artifacts on PR"

on:
  workflow_run:
    workflows:
      - "Preview Build (Android)"
      - "Preview Build (macOS)"
    types:
      - completed

concurrency:
  group: preview-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  pull-requests: write

jobs:
  comment-preview-artifacts:
    name: "Comentar links dos artefatos na PR"
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - name: Post or update PR comment with preview artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const triggerRun = context.payload.workflow_run;
            const headSha = triggerRun.head_sha;

            let prNumber = triggerRun.pull_requests?.[0]?.number;
            if (!prNumber) {
              const openPrs = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              const matchedPr =
                openPrs.find((pr) => pr.head.sha === headSha) ||
                openPrs.find(
                  (pr) =>
                    triggerRun.head_repository?.full_name &&
                    pr.head.repo?.full_name === triggerRun.head_repository.full_name &&
                    pr.head.ref === triggerRun.head_branch
                );
              prNumber = matchedPr?.number;
            }

            if (!prNumber) {
              core.info(`Nenhum PR aberto encontrado para o SHA ${headSha}.`);
              return;
            }

            const targets = [
              { label: 'Android (`aarch64` APK)', file: 'preview-android.yml' },
              { label: 'macOS (`aarch64-apple-darwin` DMG)', file: 'preview-macos.yml' },
            ];

            const rows = [];
            for (const target of targets) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: target.file,
                head_sha: headSha,
                event: 'pull_request',
                per_page: 10,
              });

              const sorted = [...data.workflow_runs].sort((a, b) => b.id - a.id);
              const latest = sorted.find((r) => r.conclusion !== 'skipped') || sorted[0];

              if (!latest || latest.conclusion === 'skipped') {
                rows.push(`| ${target.label} | ⏸️ Não executado | — |`);
                continue;
              }

              if (latest.status !== 'completed') {
                rows.push(`| ${target.label} | ⏳ Em andamento | [Ver execução](${latest.html_url}) |`);
                continue;
              }

              if (latest.conclusion !== 'success') {
                rows.push(
                  `| ${target.label} | ❌ Falhou (\`${latest.conclusion}\`) | [Ver logs](${latest.html_url}) |`
                );
                continue;
              }

              const { data: artData } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: latest.id,
              });

              if (artData.artifacts.length === 0) {
                rows.push(`| ${target.label} | ⚠️ Sem artefatos | [Ver execução](${latest.html_url}) |`);
                continue;
              }

              const links = artData.artifacts
                .map(
                  (art) =>
                    `[${art.name}](https://github.com/${owner}/${repo}/actions/runs/${latest.id}/artifacts/${art.id})`
                )
                .join('<br>');

              rows.push(`| ${target.label} | ✅ Pronto | ${links} · [Execução](${latest.html_url}) |`);
            }

            const marker = '<!-- sarue-preview-artifacts -->';
            const shortSha = headSha.slice(0, 7);
            const body = [
              marker,
              `### 📦 Builds de Preview (\`${shortSha}\`)`,
              '',
              '| Plataforma | Status | Artefato |',
              '| --- | --- | --- |',
              ...rows,
              '',
              '> Os artefatos ficam disponíveis por **14 dias** (necessário estar logado no GitHub para baixar).',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Comentário ${existing.id} atualizado no PR #${prNumber}.`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Novo comentário criado no PR #${prNumber}.`);
            }
