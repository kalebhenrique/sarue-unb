name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release Draft
        id: create-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              const res = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              release = res.data;
              console.log(`Release existente encontrada com id: ${release.id}`);
            } catch (err) {
              const res = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Saruê UnB ${tag}`,
                body: 'Veja os ativos para baixar o instalador ou utilize o auto-updater integrado no aplicativo.',
                draft: false,
                prerelease: false
              });
              release = res.data;
              console.log(`Nova release criada com id: ${release.id}`);
            }
            return release.id;

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin' # Mac Apple Silicon (M1/M2/M3/M4)
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'  # Mac Intel
          - platform: 'ubuntu-22.04'
            args: ''                              # Linux x64 (AppImage + deb)
          - platform: 'windows-latest'
            args: '--bundles nsis'                # Windows x64 (NSIS setup.exe)

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 libgtk-3-dev

      - name: Cache Tauri AppImage dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: ${{ runner.os }}-tauri-appimage-tools-v1

      - name: Pre-cache Tauri AppImage dependencies
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.cache/tauri
          if [ ! -f ~/.cache/tauri/AppRun-x86_64 ]; then
            echo "Downloading AppRun-x86_64..."
            curl -fL --retry 10 --retry-delay 5 --retry-all-errors -o ~/.cache/tauri/AppRun-x86_64 https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 || \
            gh release download apprun-old --repo tauri-apps/binary-releases --pattern "AppRun-x86_64" --dir ~/.cache/tauri
          fi
          if [ ! -f ~/.cache/tauri/linuxdeploy-x86_64.AppImage ]; then
            echo "Downloading linuxdeploy-x86_64.AppImage..."
            curl -fL --retry 10 --retry-delay 5 --retry-all-errors -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage || \
            gh release download linuxdeploy-07333c6 --repo tauri-apps/binary-releases --pattern "linuxdeploy-x86_64.AppImage" --dir ~/.cache/tauri
          fi
          chmod +x ~/.cache/tauri/AppRun-x86_64 ~/.cache/tauri/linuxdeploy-x86_64.AppImage

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: 'true'
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  finalize-release:
    needs: [create-release, publish-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: always() && needs.create-release.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Consolidate latest.json across all platforms
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/consolidate-latest-json.mjs "${{ github.ref_name }}"

      - name: Publish Release (undraft)
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
